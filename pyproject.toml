[project]
name = "flowforge"
version = "0.1.0"
description = "A distributed workflow orchestration engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "ADMIN" }]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
    "prometheus-client==0.21.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "redis==5.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "types-python-dateutil==2.9.0.20240906",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend", "worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "worker", "tests"]
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
follow_imports = "silent"
files = ["backend", "worker"]
exclude = ["backend/alembic/versions/"]

[[tool.mypy.overrides]]
module = ["sqlalchemy.dialects.postgresql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deprecated.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"